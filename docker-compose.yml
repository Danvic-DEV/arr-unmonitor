services:
  arr-unmonitor:
    image: blackduke/arr-unmonitor:latest
    # build: .  # uncomment for local development
    container_name: arr-unmonitor
    ports:
      - "5200:5200"
    environment:
      # These env vars seed servers on FIRST RUN only (empty settings).
      # After that, manage servers via the Settings tab in the UI.
      RADARR_URL: "http://radarr:7878"
      RADARR_API_KEY: ""
      SONARR_URL: "http://sonarr:8989"
      SONARR_API_KEY: ""
      SETTINGS_PATH: "/config/settings.json"
      CHANGE_LOG_PATH: "/config/change-log.jsonl"
      LOG_PATH: "/config/app-log.jsonl"
      PORT: "5200"
      # Rotate the JSONL logs at 32 MB (defaults; uncomment to change).
      # LOG_MAX_BYTES: "33554432"
      # CHANGE_LOG_MAX_BYTES: "33554432"
    volumes:
      - ./config:/config
    # An idle worker settles at ~45-70 MB RSS and does not grow with log size.
    # 512 MB leaves generous headroom for scanning a large library.
    mem_limit: 512m
    restart: unless-stopped